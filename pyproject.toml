[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "brasileirao"
version = "1.0.0"
description = "Modelo probabilistico do Brasileirao (Dixon-Coles + Elo) avaliado contra o mercado, com foco no Santos FC"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Joao Santos", email = "jonnygmos@gmail.com" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
app = ["streamlit>=1.40"]
dev = ["pytest>=8", "ruff>=0.6", "nbconvert>=7", "ipykernel>=6", "nbformat>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 115
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402", "E731"]  # notebook narrativo: imports perto do uso e helpers de uma linha
